name: Site check

# Runs on every pull request and on pushes to main. It rebuilds the generated pages and
# fails if they differ from what was committed, or if any link, #section link, or heading
# outline is broken. It does not deploy anything: GitHub Pages still publishes from main.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install the build's dependency
        run: python -m pip install -r tools/requirements.txt

      - name: Build the site and check links, anchors, and headings
        run: python tools/build_site.py

      - name: Committed pages match a fresh build
        run: |
          if ! git diff --quiet; then
            echo "::error::Generated pages are out of date. Run 'python tools/build_site.py' and commit the result."
            git status --short
            git diff --stat
            exit 1
          fi
          if [ -n "$(git status --porcelain --untracked-files=all)" ]; then
            echo "::error::The build created files that are not committed."
            git status --short
            exit 1
          fi
